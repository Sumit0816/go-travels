# Jobs the free Vercel plan can't schedule. Both skip themselves until their secrets are set
# (Settings › Secrets and variables › Actions).
name: Scheduled

on:
  schedule:
    - cron: '*/5 * * * *' # WhatsApp retries (GitHub runs these roughly every 5–15 minutes)
    - cron: '30 21 * * *' # Database backup, 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whatsapp-retries:
    if: github.event.schedule != '30 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send WhatsApp retries that are due
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET not set, skipping"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/whatsapp/process"

  backup:
    if: github.event.schedule == '30 21 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump, encrypt and upload the database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BUCKET: ${{ secrets.BACKUP_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
          PG_MAJOR: ${{ vars.BACKUP_PG_MAJOR || '17' }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ] || [ -z "$BUCKET" ]; then echo "Backup secrets not set, skipping"; exit 0; fi
          name="go-travels-$(date -u +%Y%m%d-%H%M).sql.gz.enc"
          # Customer data: encrypted before it leaves the runner, never kept as a workflow artifact.
          docker run --rm -e DATABASE_URL "postgres:${PG_MAJOR}-alpine" sh -c 'pg_dump --no-owner --no-acl "$DATABASE_URL"' \
            | gzip -9 \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASSPHRASE > "$RUNNER_TEMP/$name"
          aws s3 cp "$RUNNER_TEMP/$name" "s3://$BUCKET/db/$name" ${ENDPOINT:+--endpoint-url "$ENDPOINT"}
          rm -f "$RUNNER_TEMP/$name"
          echo "Uploaded db/$name"
