# Local PostgreSQL for development.
#   docker compose up -d
# Then set DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/go_travels in .env
# No Docker? Use `npm run db:local` instead (embedded Postgres on port 5433).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_travels
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
